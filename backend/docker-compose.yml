version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: aisimulation-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aisimulation
    volumes:
      - aisimulation_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aisimulation-redis
    ports:
      - "6379:6379"

volumes:
  aisimulation_postgres_data:
